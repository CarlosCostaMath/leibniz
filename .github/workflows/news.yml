name: Build News JSON

on:
  schedule:
    - cron: "0 * * * *"      # atualiza a cada hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser argostranslate
      - name: Generate news JSON
        run: |
          python scripts/aggregate_news.py
      - name: Commit & push
        run: |
          if [ -n "$(git status --porcelain news/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news/news.json
            git commit -m "chore(news): update news.json [skip ci]"
            git push
          else
            echo "No changes."
          fi
