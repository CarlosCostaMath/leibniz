name: Make news.json

on:
  workflow_dispatch: {}         # botão "Run workflow"
  push:                         # roda quando você fizer qualquer commit no main
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  make-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cria um news.json simples (apenas para a página /news não quebrar)
      - name: Create seed news.json
        run: |
          mkdir -p news
          cat > news/news.json << 'JSON'
          {
            "updated_at": "2025-10-31T12:00:00Z",
            "items": [
              {
                "title": "News habilitada",
                "url": "https://example.com",
                "host": "example.com",
                "source": "seed",
                "published_at": "2025-10-31T12:00:00Z",
                "brief_pt": "A seção News foi inicializada. Assim que o agregador rodar, este conteúdo será substituído.",
                "brief_en": "Seed item."
              }
            ]
          }
          JSON

      # Em vez de dar 'push' direto (que pode ser bloqueado),
      # abrimos um Pull Request automático. Você só clica "Merge".
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(news): add/update news.json"
          title: "Add/update news.json"
          body: "Automated seed for /news."
          branch: "bot/news-seed"
