title: "Leibniz Blog"
lang: pt-BR

url: "https://carloscostamath.github.io"
baseurl: "/leibniz"          # "" se for user site
timezone: America/Maceio
future: true

markdown: kramdown
theme: null
permalink: /:categories/:year/:month/:day/:title/

collections:
  posts:
    output: true

excerpt_separator: "<!--more-->"
plugins: []

default_scripts:
  - /assets/js/jquery.min.js
  - /assets/js/jquery.scrollex.min.js
  - /assets/js/jquery.scrolly.min.js
  - /assets/js/browser.min.js
  - /assets/js/breakpoints.min.js
  - /assets/js/util.js
  - /assets/js/main.js

defaults:
  - scope:
      path: ""
      type: posts
    values:
      extra_css:
        - /assets/css/post.css
