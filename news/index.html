---
layout: default
nav_section: news
title: News
permalink: /news/
description: Explore as principais notícias sobre Leibniz vinculadas a sociedades e paginas institucionais.
extra_css:
  - /assets/css/taxonomy.css
---

<div id="news-root">
  <div id="news-loading" style="padding:1rem;">Carregando últimas notícias…</div>
  <div id="news-list" class="news-grid"></div>
</div>

<style>
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:8px}
  .news-card{border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);background:#fff;transition:transform .15s, box-shadow .15s}
  .news-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.10)}
  .news-title{font-weight:800;margin:0 0 6px;line-height:1.2}
  .news-meta{font-size:.85rem;opacity:.7;margin-bottom:8px}
  .news-brief{font-size:.95rem;line-height:1.5}
  .news-link{display:inline-block;margin-top:10px;font-weight:700;text-decoration:none;border-bottom:2px solid currentColor;color:#ff7a00}
  .news-card:hover .news-link{color:#000}
</style>

<script>
(async function(){
  const API = "{{ '/news/news.json' | relative_url }}";
  const root = document.getElementById('news-root');
  const list = document.getElementById('news-list');
  const loading = document.getElementById('news-loading');

  const fmt = iso => { try { return new Date(iso).toLocaleString('pt-BR',{dateStyle:'medium', timeStyle:'short'}) } catch(e){ return iso } };

  function card(it){
    const div = document.createElement('div'); div.className = 'news-card';
    const host = it.host || (it.url ? new URL(it.url).hostname : "");
    div.innerHTML = `
      <h3 class="news-title">${it.title || '(sem título)'}</h3>
      <div class="news-meta">${fmt(it.published_at)} • ${host}</div>
      <div class="news-brief">${it.brief_pt || it.brief_en || ''}</div>
      <a class="news-link" href="${it.url}" target="_blank" rel="noopener">Ler na fonte →</a>
    `;
    return div;
  }

  try{
    const res = await fetch(API, {cache:'no-store'});
    const data = await res.json();
    loading.remove();
    if(!data || !data.items || !data.items.length){
      root.insertAdjacentHTML('beforeend','<p>Nenhuma notícia encontrada.</p>');
      return;
    }
    data.items.forEach(it => list.appendChild(card(it)));
  }catch(e){
    loading.textContent = "Não foi possível carregar as notícias.";
    console.error(e);
  }
})();
</script>
